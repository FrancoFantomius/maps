<!-- Settings Toggle Button (Bottom-Left area, z-10) -->
<div class="fixed bottom-4 left-20 z-10 pointer-events-auto bottom-ui-element">
    <button id="btn-settings-toggle"
        class="p-3 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border border-slate-200/50 dark:border-slate-800/50 rounded-full shadow-lg hover:shadow-xl text-slate-600 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition-all duration-300 flex items-center justify-center">
        <span class="material-icons-outlined text-lg leading-none">keyboard_double_arrow_up</span>
    </button>
</div>

<!-- Settings Bottom Sheet Panel (z-20, slides up from bottom) -->
<div id="settings-panel"
    class="settings-bottom-sheet fixed bottom-0 left-0 right-0 z-20 pointer-events-auto translate-y-full">
    <div
        class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border-t border-slate-200/60 dark:border-slate-800/60 shadow-[0_-8px_30px_rgba(0,0,0,0.12)] dark:shadow-[0_-8px_30px_rgba(0,0,0,0.4)] px-4 py-4 md:px-8">

        <!-- Close button -->
        <div class="flex justify-end mb-2">
            <button id="btn-settings-close"
                class="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-all duration-200 flex items-center gap-1">
                <span class="material-icons-outlined text-base leading-none">keyboard_double_arrow_down</span>
                <span class="text-[10px] font-semibold">Close</span>
            </button>
        </div>

        <!-- Settings content in horizontal layout -->
        <div class="flex flex-col md:flex-row gap-4 md:gap-6 max-w-5xl mx-auto">

            <!-- Column 1: Header + Overlays -->
            <div class="flex-1 min-w-0">
                <div class="mb-3">
                    <h3 class="font-display font-bold text-sm text-slate-900 dark:text-slate-100">Map Settings</h3>
                    <p class="text-[10px] text-slate-400 dark:text-slate-500">Configure map layers, overlays, and
                        system appearance</p>
                </div>
                <div class="space-y-2 pt-1">
                    <span
                        class="block text-[9px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">Show
                        Details</span>
                    <div class="space-y-2.5">
                        <label class="flex items-center justify-between cursor-pointer group">
                            <span
                                class="text-xs text-slate-600 dark:text-slate-300 group-hover:text-slate-900 dark:group-hover:text-slate-100 font-medium">Street
                                Names</span>
                            <div class="relative w-8 h-4">
                                <input type="checkbox" id="toggle-overlay-labels" class="sr-only peer">
                                <div
                                    class="w-8 h-4 bg-slate-200 dark:bg-slate-850 rounded-full peer peer-checked:bg-indigo-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:after:translate-x-4">
                                </div>
                            </div>
                        </label>
                        <label class="flex items-center justify-between cursor-pointer group">
                            <span
                                class="text-xs text-slate-600 dark:text-slate-300 group-hover:text-slate-900 dark:group-hover:text-slate-100 font-medium">Bike
                                Paths</span>
                            <div class="relative w-8 h-4">
                                <input type="checkbox" id="toggle-overlay-bike" class="sr-only peer">
                                <div
                                    class="w-8 h-4 bg-slate-200 dark:bg-slate-850 rounded-full peer peer-checked:bg-indigo-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:after:translate-x-4">
                                </div>
                            </div>
                        </label>
                        <label class="flex items-center justify-between cursor-pointer group">
                            <span
                                class="text-xs text-slate-600 dark:text-slate-300 group-hover:text-slate-900 dark:group-hover:text-slate-100 font-medium">Buildings</span>
                            <div class="relative w-8 h-4">
                                <input type="checkbox" id="toggle-overlay-perspective" class="sr-only peer">
                                <div
                                    class="w-8 h-4 bg-slate-200 dark:bg-slate-850 rounded-full peer peer-checked:bg-indigo-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:after:translate-x-4">
                                </div>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Column 2: Home Location + Rotation -->
            <div class="flex-1 min-w-0 md:border-l md:border-slate-100 md:dark:border-slate-800 md:pl-6">
                <div class="space-y-2">
                    <span
                        class="block text-[9px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">Home
                        Location</span>
                    <div id="home-address-card" class="hidden p-2.5 rounded-xl bg-indigo-50/70 dark:bg-indigo-950/40 border border-indigo-200/60 dark:border-indigo-900/40 flex flex-col gap-1.5 shadow-sm">
                        <div class="flex items-start justify-between gap-1.5">
                            <div class="flex items-center gap-1.5 text-indigo-600 dark:text-indigo-400 font-bold text-xs">
                                <span class="material-icons-outlined text-base">home</span>
                                <span>Home Address</span>
                            </div>
                            <div class="flex items-center gap-1">
                                <button id="btn-fly-home" type="button" title="Fly to Home" class="p-1 rounded text-indigo-600 dark:text-indigo-400 hover:bg-indigo-100 dark:hover:bg-indigo-900/50 transition-colors">
                                    <span class="material-icons-outlined text-sm">my_location</span>
                                </button>
                                <button id="btn-clear-home" type="button" title="Clear Home Address" class="p-1 rounded text-red-500 hover:bg-red-100 dark:hover:bg-red-950/50 transition-colors">
                                    <span class="material-icons-outlined text-sm">delete_outline</span>
                                </button>
                            </div>
                        </div>
                        <div id="home-address-text" class="text-[11px] font-medium text-slate-700 dark:text-slate-200 leading-snug line-clamp-2">
                        </div>
                    </div>

                    <!-- Address Search Input & Autocomplete -->
                    <div class="relative">
                        <div class="relative flex items-center">
                            <input type="text" id="home-address-input" placeholder="Search home address..."
                                autocomplete="off"
                                class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200/80 dark:border-slate-800/80 rounded-lg px-2.5 py-1.5 text-[11px] font-medium text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-indigo-500/50 pr-7">
                            <button type="button" id="btn-save-home-input" title="Save address"
                                class="absolute right-1 text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 p-1 flex items-center justify-center">
                                <span class="material-icons-outlined text-base">check</span>
                            </button>
                        </div>
                        <div id="home-address-autocomplete"
                            class="hidden absolute left-0 right-0 top-full mt-1 z-50 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-xl max-h-40 overflow-y-auto custom-scrollbar">
                        </div>
                    </div>
                </div>
                <div class="space-y-2 border-t border-slate-100 dark:border-slate-800 pt-3 mt-3">
                    <span
                        class="block text-[9px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">Map
                        Rotation</span>
                    <div class="flex items-center justify-between gap-2">
                        <button id="btn-rotate-ccw" title="Rotate Counter-Clockwise"
                            class="flex-1 py-1.5 px-2 rounded-lg bg-slate-50 dark:bg-slate-950 text-slate-700 dark:text-slate-350 hover:bg-slate-100 dark:hover:bg-slate-850 font-semibold text-[11px] transition-colors border border-slate-200/50 dark:border-slate-800/30">
                            Rotate CCW
                        </button>
                        <button id="btn-rotate-cw" title="Rotate Clockwise"
                            class="flex-1 py-1.5 px-2 rounded-lg bg-slate-50 dark:bg-slate-950 text-slate-700 dark:text-slate-350 hover:bg-slate-100 dark:hover:bg-slate-850 font-semibold text-[11px] transition-colors border border-slate-200/50 dark:border-slate-800/30">
                            Rotate CW
                        </button>
                    </div>
                </div>
            </div>

            <!-- Column 3: Sliders + Theme -->
            <div class="flex-1 min-w-0 md:border-l md:border-slate-100 md:dark:border-slate-800 md:pl-6">
                <div class="flex flex-col gap-1">
                    <div class="flex justify-between text-[10px] text-slate-400 dark:text-slate-500 font-medium">
                        <span>Bearing Angle</span>
                        <span id="bearing-value">0°</span>
                    </div>
                    <input type="range" id="bearing-slider" min="-180" max="180" value="0"
                        class="w-full h-1 bg-slate-200 dark:bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-600 dark:accent-indigo-400">
                </div>
                <div class="flex flex-col gap-1 mt-3">
                    <div class="flex justify-between text-[10px] text-slate-400 dark:text-slate-500 font-medium">
                        <span>Tilt / Pitch</span>
                        <span id="pitch-value">0°</span>
                    </div>
                    <input type="range" id="pitch-slider" min="0" max="60" value="0"
                        class="w-full h-1 bg-slate-200 dark:bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-600 dark:accent-indigo-400">
                </div>
                <div class="space-y-2 border-t border-slate-100 dark:border-slate-800 pt-3 mt-3">
                    <span
                        class="block text-[9px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">Appearance
                        Theme</span>
                    <div
                        class="grid grid-cols-3 gap-1 bg-slate-100 dark:bg-slate-950 p-1 rounded-xl border border-slate-250/50 dark:border-slate-800/30 text-center text-xs">
                        <button data-theme-btn="light"
                            class="py-1 rounded-lg font-semibold transition-all">Light</button>
                        <button data-theme-btn="system"
                            class="py-1 rounded-lg font-semibold transition-all">System</button>
                        <button data-theme-btn="dark"
                            class="py-1 rounded-lg font-semibold transition-all">Dark</button>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
