<link rel="stylesheet" href="/css/settings-panel.css">
<!-- Settings Toggle Button (Hidden: triggered via Layers button in layer switcher) -->
<div class="settings-toggle-wrapper bottom-ui-element hidden" style="display: none;">
    <button id="btn-settings-toggle" class="btn-settings-toggle" aria-label="Settings Toggle">
        <span class="material-icons-outlined" style="font-size: 1.125rem;">keyboard_double_arrow_up</span>
    </button>
</div>

<!-- Settings Bottom Sheet (M3 Bottom Sheet with 100% width and sharp corners) -->
<md-bottom-sheet
    id="settings-panel"
    type="modal"
    divider
    style="--md-bottom-sheet-max-width: 100%; --md-bottom-sheet-shape: 0px; border-radius: 0;"
>
    <!-- Custom Header Title & Subtitle -->
    <div slot="headline" style="font-family: var(--font-display, inherit); font-weight: 700; font-size: 1.125rem; color: var(--text-primary);" data-i18n="settings.title">
        Map Settings
    </div>
    <div slot="subhead" style="font-size: 0.75rem; color: var(--text-muted);" data-i18n="settings.subtitle">
        Configure map layers, overlays, and system appearance
    </div>

    <!-- Close Button -->
    <md-icon-button slot="close-button" id="btn-settings-close" icon="close" aria-label="Close" data-i18n-title="nav.close"></md-icon-button>

    <!-- Settings Content Grid (Only core map settings: Overlays and Theme) -->
    <div class="settings-grid">
        <!-- Column 1: Show Details / Map Overlays -->
        <div class="settings-col">
            <span class="settings-section-title" data-i18n="settings.show_details">Show Details</span>
            <div class="settings-toggle-list">
                <div class="settings-toggle-row">
                    <span class="settings-toggle-label" data-i18n="settings.street_names">Street Names</span>
                    <md-switch id="toggle-overlay-labels" aria-label="Street Names"></md-switch>
                </div>
                <div class="settings-toggle-row">
                    <span class="settings-toggle-label" data-i18n="settings.bike_paths">Bike Paths</span>
                    <md-switch id="toggle-overlay-bike" aria-label="Bike Paths"></md-switch>
                </div>
                <div class="settings-toggle-row">
                    <span class="settings-toggle-label" data-i18n="settings.buildings">Buildings</span>
                    <md-switch id="toggle-overlay-perspective" aria-label="Buildings"></md-switch>
                </div>
            </div>
        </div>

        <!-- Column 2: Appearance Theme -->
        <div class="settings-col">
            <span class="settings-section-title" data-i18n="settings.appearance_theme">Appearance Theme</span>
            <div class="theme-btn-grid">
                <button data-theme-btn="light" data-i18n="settings.theme_light">Light</button>
                <button data-theme-btn="system" data-i18n="settings.theme_system">System</button>
                <button data-theme-btn="dark" data-i18n="settings.theme_dark">Dark</button>
            </div>
        </div>
    </div>
</md-bottom-sheet>
