<link rel="stylesheet" href="/css/ui-templates.css">
<!-- HTML Templates for Decoupled UI Rendering -->
<template id="template-place-details-loading">
    <div style="padding: 1rem; height: 100%; display: flex; flex-direction: column;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 0.5rem;">
            <span style="padding: 0.125rem 0.625rem; border-radius: 9999px; font-size: 9px; font-weight: 700; text-transform: uppercase; border: 1px solid var(--border-subtle); color: var(--text-muted); background-color: var(--bg-subtle);">Searching...</span>
            <button type="button" class="btn-close" style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600; border: none; background: transparent; cursor: pointer;">✕ Close</button>
        </div>
        <div class="animate-pulse" style="display: flex; flex-direction: column; justify-content: space-between; flex: 1; overflow-y: auto;">
            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                <div style="height: 1rem; background-color: var(--bg-subtle); border-radius: 0.25rem; width: 66%;"></div>
                <div style="height: 0.75rem; background-color: var(--bg-subtle); border-radius: 0.25rem; width: 33%; margin-top: 0.5rem;"></div>
                <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem;">
                    <div style="height: 0.75rem; background-color: var(--bg-subtle); border-radius: 0.25rem; width: 100%;"></div>
                    <div style="height: 0.75rem; background-color: var(--bg-subtle); border-radius: 0.25rem; width: 83%;"></div>
                    <div style="height: 0.75rem; background-color: var(--bg-subtle); border-radius: 0.25rem; width: 80%;"></div>
                </div>
            </div>
        </div>
    </div>
</template>

<template id="template-place-details-temp">
    <div style="display: flex; flex-direction: column; height: 100%; overflow: hidden;">
        <!-- Cover Header Image/Gradient Card -->
        <div class="wiki-image-container">
            <img class="wiki-image hidden" src="" alt="Place Image">
            <div class="wiki-image-overlay"></div>

            <!-- Absolute Overlay Contents -->
            <div class="wiki-image-title-box">
                <h3 class="place-name">Dropped Pin</h3>
            </div>

            <!-- Floating Close button -->
            <button type="button" class="btn-close wiki-btn-close">
                <span class="material-icons-outlined" style="font-size: 0.875rem;">close</span>
            </button>
        </div>

        <!-- Padded content area below image -->
        <div class="place-details-body">
            <!-- Scrollable Content -->
            <div class="place-details-content custom-scrollbar">
                <!-- Coordinates Badge -->
                <div class="coords-badge">
                    <span class="material-icons-outlined">pin_drop</span>
                    <span class="place-coords"></span>
                </div>

                <div class="street-highlight-container hidden">
                    <div class="street-highlight-card">
                        <span class="material-icons-outlined" style="font-size: 1rem;">directions_bike</span>
                        <span class="street-name"></span>
                    </div>
                </div>

                <div class="wiki-summary-container wiki-summary-card hidden">
                    <div class="wiki-summary-bar"></div>
                </div>

                <p class="place-address hidden" style="font-size: 0.75rem; color: var(--text-secondary); background: var(--bg-subtle); padding: 0.75rem; border-radius: 0.75rem; border: 1px solid var(--border-subtle); line-height: 1.5; margin: 0;"></p>

                <div class="place-default-prompt hidden">
                    To store this coordinate as a saved place, click the button below to assign a name, category, and description.
                </div>

                <div class="shop-info-container shop-info-card hidden">
                    <div class="shop-info-title">
                        <span class="material-icons-outlined">storefront</span>
                        <span>Shop Details</span>
                    </div>
                    <div class="shop-type hidden shop-row"><span class="shop-row-label">Type:</span> <span class="shop-type-val shop-row-val"></span></div>
                    <div class="shop-brand hidden shop-row"><span class="shop-row-label">Brand:</span> <span class="shop-brand-val shop-row-val"></span></div>
                    <div class="shop-hours hidden shop-row"><span class="shop-row-label">Hours:</span> <span class="shop-hours-val shop-row-val"></span></div>
                    <div class="shop-cuisine hidden shop-row"><span class="shop-row-label">Cuisine:</span> <span class="shop-cuisine-val shop-row-val"></span></div>
                    <div class="shop-web hidden shop-row"><span class="shop-row-label">Web:</span> <a href="" target="_blank" class="shop-web-link" style="color: var(--color-indigo); font-weight: 600; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px;"></a></div>
                    <div class="shop-phone hidden shop-row"><span class="shop-row-label">Phone:</span> <span class="shop-phone-val shop-row-val"></span></div>
                </div>
            </div>

            <!-- Details Action Bar -->
            <div class="place-actions-bar">
                <button class="btn-save btn-action-primary">
                    <span class="material-icons-outlined" style="font-size: 0.875rem;">bookmark_add</span>
                    <span>Save Place</span>
                </button>
                <button class="btn-directions btn-action-blue">
                    <span class="material-icons-outlined" style="font-size: 0.875rem;">directions</span>
                    <span>Directions</span>
                </button>
            </div>

            <!-- FOOTER CREDITS -->
            <div class="details-footer-credits">
                <a href="https://nominatim.openstreetmap.org/" target="_blank">Nominatim</a>
                <span class="wiki-credit hidden">·</span>
                <a href="" target="_blank" class="wiki-credit wiki-link hidden">Wikipedia</a>
            </div>
        </div>
    </div>
</template>

<template id="template-place-details-saved">
    <div style="display: flex; flex-direction: column; height: 100%; overflow: hidden;">
        <!-- Cover Header Image/Gradient Card -->
        <div class="wiki-image-container">
            <img class="wiki-image hidden" src="" alt="Place Image">
            <div class="wiki-image-overlay"></div>

            <!-- Absolute Overlay Contents -->
            <div class="wiki-image-title-box">
                <span class="place-badge">
                    <span class="place-badge-dot"></span>
                    SAVED LOCATION
                </span>
                <h3 class="place-name"></h3>
            </div>

            <!-- Floating Close button -->
            <button type="button" class="btn-close wiki-btn-close">
                <span class="material-icons-outlined" style="font-size: 0.875rem;">close</span>
            </button>
        </div>

        <!-- Padded content area below image -->
        <div class="place-details-body">
            <!-- Scrollable Content -->
            <div class="place-details-content custom-scrollbar">
                <div class="coords-badge">
                    <span class="material-icons-outlined">pin_drop</span>
                    <span class="place-coords"></span>
                </div>
                <div class="place-desc-container">
                    <div class="wiki-summary-bar"></div>
                    <p class="place-desc-text" style="font-size: 0.75rem; color: var(--text-primary); line-height: 1.5; margin: 0;"></p>
                </div>
            </div>

            <!-- Details Action Bar -->
            <div style="display: flex; flex-direction: column; gap: 0.5rem; padding-top: 0.75rem; margin-top: 0.75rem; border-top: 1px solid var(--border-subtle); flex-shrink: 0;">
                <button class="btn-directions btn-action-blue" style="width: 100%;">
                    <span class="material-icons-outlined" style="font-size: 0.875rem;">directions</span>
                    <span>Get Directions</span>
                </button>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <button class="btn-edit btn-action-secondary">
                        <span class="material-icons-outlined" style="font-size: 0.75rem;">edit</span>
                        <span>Edit</span>
                    </button>
                    <button class="btn-delete btn-action-danger">
                        <span class="material-icons-outlined" style="font-size: 0.75rem;">delete</span>
                        <span>Delete</span>
                    </button>
                </div>
            </div>

            <!-- FOOTER CREDITS -->
            <div class="details-footer-credits">
                <a href="https://nominatim.openstreetmap.org/" target="_blank">Nominatim</a>
                <span class="wiki-credit hidden">·</span>
                <a href="" target="_blank" class="wiki-credit wiki-link hidden">Wikipedia</a>
            </div>
        </div>
    </div>
</template>

<template id="template-marker-list-item">
    <div class="marker-item">
        <div class="marker-focus">
            <span class="marker-color-dot"></span>
            <div class="marker-name"></div>
        </div>
        <button class="btn-delete-marker">✕</button>
    </div>
</template>

<template id="template-autocomplete-item">
    <div class="nav-autocomplete-item">
        <div style="display: flex; align-items: flex-start; gap: 0.5rem;">
            <span class="material-icons-outlined" style="font-size: 0.875rem; color: var(--text-muted); margin-top: 2px; flex-shrink: 0;">location_on</span>
            <div style="min-width: 0;">
                <div class="item-name"></div>
                <div class="item-address"></div>
            </div>
        </div>
    </div>
</template>

<template id="template-routing-step-item">
    <div class="nav-step-item">
        <div style="display: flex; flex-direction: column; align-items: center; flex-shrink: 0; width: 2rem;">
            <div class="step-icon-container">
                <span class="step-icon material-icons-outlined" style="font-size: 1rem;"></span>
            </div>
            <div class="step-line"></div>
        </div>
        <div style="flex: 1; min-width: 0; padding-top: 0.25rem;">
            <div class="step-instruction"></div>
            <div class="step-distance"></div>
        </div>
    </div>
</template>

<template id="template-search-result-item">
    <div class="search-result-item">
        <div class="result-name"></div>
        <div class="result-address"></div>
    </div>
</template>
