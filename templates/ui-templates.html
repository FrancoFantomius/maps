<link rel="stylesheet" href="/css/ui-templates.css">
<!-- HTML Templates for Decoupled UI Rendering -->
<template id="template-marker-list-item">
    <md-list-item class="marker-item" interactive>
        <div slot="start" class="marker-leading-badge">
            <span class="marker-color-dot"></span>
            <span class="marker-category-emoji"></span>
        </div>
        <span class="marker-name" style="display: none;"></span>
        <span class="marker-subtext" style="display: none;"></span>
        <span class="marker-focus" style="display: none;"></span>
        <md-icon-button slot="end" class="btn-delete-marker" icon="delete" variant="standard" aria-label="Delete" title="Delete"></md-icon-button>
    </md-list-item>
</template>

<template id="template-autocomplete-item">
    <div class="nav-autocomplete-item">
        <div style="display: flex; align-items: flex-start; gap: 0.5rem;">
            <span class="material-icons-outlined" style="font-size: 0.875rem; color: var(--text-muted); margin-top: 2px; flex-shrink: 0;">location_on</span>
            <div style="min-width: 0;">
                <div class="item-name"></div>
                <div class="item-address"></div>
            </div>
        </div>
    </div>
</template>

<template id="template-routing-step-item">
    <div class="nav-step-item">
        <div style="display: flex; flex-direction: column; align-items: center; flex-shrink: 0; width: 2rem;">
            <div class="step-icon-container">
                <span class="step-icon material-icons-outlined" style="font-size: 1rem;"></span>
            </div>
            <div class="step-line"></div>
        </div>
        <div style="flex: 1; min-width: 0; padding-top: 0.25rem;">
            <div class="step-instruction"></div>
            <div class="step-distance"></div>
        </div>
    </div>
</template>

<template id="template-search-result-item">
    <div class="search-result-item">
        <div class="result-name"></div>
        <div class="result-address"></div>
    </div>
</template>
