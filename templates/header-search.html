<link rel="stylesheet" href="/css/header-search.css">
<!-- Floating HUD Top Bar (z-10) -->
<div class="hud-top-bar">
    <!-- Floating HUD Stack (Top-Left area) -->
    <div class="hud-top-stack">
        <!-- Floating Search pill -->
        <div class="header-search-pill">
            <!-- Bookmarks / My Places Toggle Button -->
            <button type="button" id="btn-toggle-places" class="btn-toggle-places" title="My Places" data-i18n-title="hud.markers">
                <span class="material-icons-outlined select-none" style="font-size: 1.25rem;">bookmarks</span>
            </button>

            <div class="search-form-wrapper">
                <!-- Search input form -->
                <form id="search-form" class="header-search-form">
                    <input type="text" id="search-input" placeholder="Search" data-i18n-placeholder="hud.search_placeholder"
                        class="header-search-input">
                    <button type="button" id="btn-clear-search" class="btn-clear-search hidden">
                        <span class="material-icons-outlined" style="font-size: 1rem;">clear</span>
                    </button>
                    <button type="submit" class="btn-search-submit">
                        <span class="material-icons-outlined" style="font-size: 1.125rem;">search</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Floating Account Controls (Top-Right area) -->
    <div class="header-account-area">
        <!-- M3 Sign In Button (shown when logged out) -->
        <md-button id="btn-sync-login" variant="filled">
            <span data-i18n="login.sign_in">Sign In</span>
        </md-button>

        <!-- Profile Avatar/Icon Button (shown when logged in) -->
        <button id="btn-sync-profile" class="profile-btn shadow-md" title="Profile" data-i18n-title="hud.account" style="display: none;">
            <img id="header-profile-avatar" src="" alt="Avatar" style="display: none;">
            <div id="header-profile-letter" class="profile-avatar-letter" style="display: none;"></div>
            <span id="header-profile-icon"
                class="material-icons-outlined text-slate-500 text-lg leading-none">person</span>
        </button>

        <!-- Account Dropdown Card -->
        <div id="account-dropdown" class="account-dropdown" style="display: none;">
            <div id="account-dropdown-email" class="account-dropdown-email">email@example.com</div>

            <div class="dropdown-avatar-container shadow-inner">
                <img id="dropdown-profile-avatar" src="" alt="Avatar" style="display: none;">
                <div id="dropdown-profile-letter" class="dropdown-avatar-letter" style="display: none;"></div>
                <span id="dropdown-profile-icon"
                    class="material-icons-outlined text-slate-400 text-3xl leading-none">person</span>
            </div>

            <div id="dropdown-profile-username" class="dropdown-username font-display">Username</div>

            <div class="dropdown-actions">
                <button id="btn-dropdown-signout" class="dropdown-btn dropdown-btn-secondary">
                    <span class="material-icons-outlined text-base">logout</span>
                    <span data-i18n="login.sign_out">Sign out</span>
                </button>
                <button id="btn-dropdown-purge" class="dropdown-btn dropdown-btn-danger">
                    <span class="material-icons-outlined text-base">delete_forever</span>
                    <span>Purge Local Cache</span>
                </button>
            </div>

            <div class="dropdown-footer">
                <a href="privacy.html" target="_blank" data-i18n="nav.privacy">Privacy Policy</a>
                <span>•</span>
                <a href="terms.html" target="_blank" data-i18n="nav.terms">Terms of Service</a>
            </div>
        </div>
    </div>
</div>
