<!-- Floating HUD Stack (Top-Left area, z-10) -->
<div class="fixed top-4 left-4 right-4 md:right-auto md:w-96 z-10 pointer-events-none flex flex-col gap-3">
    <!-- Floating Search pill -->
    <div
        class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border border-slate-200/50 dark:border-slate-800/50 rounded-2xl shadow-lg hover:shadow-xl transition-all duration-300 p-1.5 flex items-center gap-2 pointer-events-auto">
        <!-- Bookmarks / My Places Toggle Button -->
        <button type="button" id="btn-toggle-places"
            class="w-7 h-7 flex items-center justify-center flex-shrink-0 text-indigo-600 dark:text-indigo-400 hover:text-indigo-500 dark:hover:text-indigo-300 transition-colors cursor-pointer"
            title="My Places">
            <span class="material-icons-outlined text-xl select-none">bookmarks</span>
        </button>

        <div class="flex-1 min-w-0">
            <!-- Search input form -->
            <form id="search-form" class="relative flex items-center">
                <input type="text" id="search-input" placeholder="Search"
                    class="w-full bg-transparent pl-1 pr-7 py-1 text-sm font-medium focus:outline-none text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500">
                <button type="button" id="btn-clear-search"
                    class="hidden absolute right-7 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 flex items-center justify-center">
                    <span class="material-icons-outlined text-base">clear</span>
                </button>
                <button type="submit"
                    class="p-1 text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors flex-shrink-0 flex items-center justify-center">
                    <span class="material-icons-outlined text-lg leading-none">search</span>
                </button>
            </form>
        </div>

        <!-- Vertical Divider -->
        <div class="h-6 w-[1px] bg-slate-200 dark:bg-slate-800 flex-shrink-0 mx-1"></div>

        <!-- Floating Account Controls (z-10) -->
        <div class="relative flex-shrink-0 flex items-center">
            <!-- Sign In Button (shown when logged out) -->
            <button id="btn-sync-login"
                class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 dark:bg-indigo-750 dark:hover:bg-indigo-650 text-white text-xs font-bold rounded-full shadow-md transition-all cursor-pointer whitespace-nowrap">
                Sign in
            </button>

            <!-- Profile Avatar/Icon Button (shown when logged in) -->
            <button id="btn-sync-profile" class="profile-btn shadow-md" title="Profile" style="display: none;">
                <img id="header-profile-avatar" src="" alt="Avatar" style="display: none;">
                <div id="header-profile-letter" class="profile-avatar-letter" style="display: none;"></div>
                <span id="header-profile-icon"
                    class="material-icons-outlined text-slate-500 text-lg leading-none">person</span>
            </button>

            <!-- Account Dropdown Card -->
            <div id="account-dropdown" class="account-dropdown" style="display: none;">
                <div id="account-dropdown-email" class="account-dropdown-email">email@example.com</div>

                <div class="dropdown-avatar-container shadow-inner">
                    <img id="dropdown-profile-avatar" src="" alt="Avatar" style="display: none;">
                    <div id="dropdown-profile-letter" class="dropdown-avatar-letter" style="display: none;"></div>
                    <span id="dropdown-profile-icon"
                        class="material-icons-outlined text-slate-400 text-3xl leading-none">person</span>
                </div>

                <div id="dropdown-profile-username" class="dropdown-username font-display">Username</div>

                <div class="dropdown-actions">
                    <button id="btn-dropdown-signout" class="dropdown-btn dropdown-btn-secondary">
                        <span class="material-icons-outlined text-base">logout</span>
                        <span>Sign out</span>
                    </button>
                    <button id="btn-dropdown-purge" class="dropdown-btn dropdown-btn-danger">
                        <span class="material-icons-outlined text-base">delete_forever</span>
                        <span>Purge Local Cache</span>
                    </button>
                </div>

                <div class="dropdown-footer flex justify-center gap-2">
                    <a href="privacy.html" target="_blank" class="hover:underline">Privacy Policy</a>
                    <span>•</span>
                    <a href="terms.html" target="_blank" class="hover:underline">Terms of Service</a>
                </div>
            </div>
        </div>
    </div>
</div>
