<link rel="stylesheet" href="/css/map-controls.css">
<!-- Floating Action Button Stack (Bottom-Right area, z-10) -->
<div id="map-controls-stack" class="bottom-ui-element">
    <!-- Distance Measure Button -->
    <button id="btn-draw" class="map-control-btn btn-teal">
        <span class="material-icons-outlined" style="font-size: 1.125rem;">straighten</span>
        <span data-i18n="hud.measure" class="map-control-tooltip">Measure Distance</span>
    </button>

    <!-- Routes Toggle Button -->
    <button id="btn-route" class="map-control-btn btn-blue">
        <span class="material-icons-outlined" style="font-size: 1.125rem;">directions</span>
        <span data-i18n="hud.route" class="map-control-tooltip">Directions</span>
    </button>

    <!-- Perspective Toggle Button -->
    <button id="btn-perspective" class="map-control-btn btn-indigo">
        <span class="material-icons-outlined" style="font-size: 1.125rem;">3d_rotation</span>
        <span data-i18n="settings.buildings" class="map-control-tooltip">Perspective</span>
    </button>

    <!-- Compass & Flanking Rotate Buttons -->
    <div class="compass-wrapper">
        <!-- Rotate Left Button -->
        <button id="btn-rotate-left" class="compass-rotate-btn btn-rot-left"
            title="Rotate Left" data-i18n-title="settings.rotate_ccw">
            <span class="material-icons-outlined" style="font-size: 1rem;">rotate_right</span>
        </button>

        <!-- Compass Rotate Button -->
        <button id="btn-compass" class="map-control-btn">
            <div id="compass-needle" style="transform: rotate(0deg);">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 2"
                        opacity="0.4" />
                    <path d="M12 3L15.5 11.5H8.5L12 3Z" fill="#ef4444" />
                    <path d="M12 21L8.5 12.5H15.5L12 21Z" fill="currentColor" opacity="0.6" />
                    <circle cx="12" cy="12" r="1.5" fill="currentColor" />
                </svg>
            </div>
            <span data-i18n="controls.reset_north" class="map-control-tooltip">Reset North</span>
        </button>

        <!-- Rotate Right Button -->
        <button id="btn-rotate-right" class="compass-rotate-btn btn-rot-right"
            title="Rotate Right" data-i18n-title="settings.rotate_cw">
            <span class="material-icons-outlined" style="font-size: 1rem;">rotate_left</span>
        </button>
    </div>

    <!-- GPS Geolocation Button -->
    <button id="btn-gps" class="map-control-btn btn-emerald">
        <span style="position: relative; display: flex; align-items: center; justify-content: center; pointer-events: none;">
            <span class="material-icons-outlined gps-icon-main" style="font-size: 1.125rem;">location_searching</span>
            <span class="material-icons-outlined gps-center-dot" style="font-size: 6px; position: absolute; inset: 0; align-items: center; justify-content: center;">circle</span>
        </span>
        <span data-i18n="controls.my_location" class="map-control-tooltip">GPS Locate</span>
    </button>
</div>
