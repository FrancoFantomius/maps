<link rel="stylesheet" href="/css/marker-modal.css">
<!-- Place Marker Creation/Editing M3 Dialog -->
<md-dialog id="marker-modal" headline="Save Location" icon="bookmark" class="hidden">
    <span id="modal-title" slot="headline" data-i18n="markers.add_marker">Save Location</span>

    <form id="marker-form" class="marker-dialog-form">
        <input type="hidden" id="modal-lat">
        <input type="hidden" id="modal-lng">
        <input type="hidden" id="modal-id">

        <md-text-field
            id="modal-name"
            label="Place Name"
            variant="outlined"
            required
            data-i18n-label="markers.name"
            placeholder="Scenic overview, local cafe..."
        ></md-text-field>

        <div class="marker-category-group">
            <label class="marker-category-label" data-i18n="markers.category">Category Type</label>
            <md-radio-group id="modal-category" name="marker_category" value="poi" class="marker-category-radios">
                <md-radio value="poi">🎯 Point of Interest</md-radio>
                <md-radio value="home">🏠 Home</md-radio>
                <md-radio value="food">🍕 Food & Drink</md-radio>
                <md-radio value="lodging">🏨 Lodging</md-radio>
                <md-radio value="nature">🌿 Nature / Scenic</md-radio>
            </md-radio-group>
        </div>

        <md-text-field
            id="modal-desc"
            label="Description & Notes"
            variant="outlined"
            data-i18n-label="markers.description"
            placeholder="Add specific notes, descriptions..."
        ></md-text-field>
    </form>

    <div slot="actions" class="marker-modal-actions">
        <md-button type="button" id="btn-close-marker-modal" variant="text">
            <span data-i18n="markers.cancel">Cancel</span>
        </md-button>
        <md-button type="submit" id="btn-save-marker-modal" variant="filled" form="marker-form">
            <span data-i18n="markers.save">Save Marker</span>
        </md-button>
    </div>
</md-dialog>
