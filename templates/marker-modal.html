<link rel="stylesheet" href="/css/marker-modal.css">
<!-- Modal 1: Place Marker Creation/Editing Form (z-[1000]) -->
<div id="marker-modal" class="marker-modal-backdrop hidden">
    <div class="marker-modal-card">
        <h3 class="marker-modal-title" id="modal-title" data-i18n="markers.add_marker">Save Location</h3>
        <form id="marker-form" style="display: flex; flex-direction: column; gap: 0.875rem; margin: 0;">
            <input type="hidden" id="modal-lat">
            <input type="hidden" id="modal-lng">
            <input type="hidden" id="modal-id">

            <div>
                <label class="marker-form-label" data-i18n="markers.name">Place Name</label>
                <input type="text" id="modal-name" required placeholder="Scenic overview, local cafe..." class="marker-form-input">
            </div>
            <div>
                <label class="marker-form-label" data-i18n="markers.category">Category Type</label>
                <select id="modal-category" class="marker-form-input">
                    <option value="poi">🎯 Point of Interest</option>
                    <option value="home">🏠 Home</option>
                    <option value="food">🍕 Food & Drink</option>
                    <option value="lodging">🏨 Lodging</option>
                    <option value="nature">🌿 Nature / Scenic</option>
                </select>
            </div>
            <div>
                <label class="marker-form-label" data-i18n="markers.description">Description & Notes</label>
                <textarea id="modal-desc" rows="3" placeholder="Add specific notes, descriptions..." class="marker-form-input" style="resize: none;"></textarea>
            </div>
            <div class="marker-modal-actions">
                <button type="button" id="btn-close-marker-modal" data-i18n="markers.cancel" class="btn-marker-cancel">Cancel</button>
                <button type="submit" data-i18n="markers.save" class="btn-marker-save">Save Marker</button>
            </div>
        </form>
    </div>
</div>
