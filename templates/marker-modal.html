<!-- Modal 1: Place Marker Creation/Editing Form (z-[1000]) -->
<div id="marker-modal"
    class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-[1000] hidden flex items-center justify-center p-4">
    <div
        class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-sm w-full p-5 shadow-2xl transform scale-95 transition-all">
        <h3 class="font-display text-base font-bold text-slate-900 dark:text-slate-100 mb-4" id="modal-title" data-i18n="markers.add_marker">Save
            Location</h3>
        <form id="marker-form" class="space-y-4">
            <input type="hidden" id="modal-lat">
            <input type="hidden" id="modal-lng">
            <input type="hidden" id="modal-id">

            <div>
                <label
                    class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-1.5" data-i18n="markers.name">Place
                    Name</label>
                <input type="text" id="modal-name" required placeholder="Scenic overview, local cafe..."
                    class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-250 dark:border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 focus:outline-none transition-all">
            </div>
            <div>
                <label
                    class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-1.5" data-i18n="markers.category">Category
                    Type</label>
                <select id="modal-category"
                    class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-250 dark:border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 focus:outline-none transition-all">
                    <option value="poi">🎯 Point of Interest</option>
                    <option value="home">🏠 Home</option>
                    <option value="food">🍕 Food & Drink</option>
                    <option value="lodging">🏨 Lodging</option>
                    <option value="nature">🌿 Nature / Scenic</option>
                </select>
            </div>
            <div>
                <label
                    class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-1.5" data-i18n="markers.description">Description
                    & Notes</label>
                <textarea id="modal-desc" rows="3" placeholder="Add specific notes, descriptions..."
                    class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-250 dark:border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 focus:outline-none transition-all resize-none"></textarea>
            </div>
            <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-100 dark:border-slate-800">
                <button type="button" id="btn-close-marker-modal" data-i18n="markers.cancel"
                    class="px-4 py-2 rounded-xl text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xs font-semibold transition-colors">Cancel</button>
                <button type="submit" data-i18n="markers.save"
                    class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold shadow-md transition-colors">Save
                    Marker</button>
            </div>
        </form>
    </div>
</div>
