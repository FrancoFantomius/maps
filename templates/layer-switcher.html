<link rel="stylesheet" href="/css/layer-switcher.css">
<!-- Floating Layer Switcher & Bottom-Left Map Controls (z-10) -->
<div id="layer-switcher" class="bottom-ui-element" role="toolbar" aria-label="Map Navigation and Layers">
    <!-- Main switcher container with satellite preview and layers button -->
    <div class="layer-switcher-container">
        <button id="layer-toggle-btn" class="layer-toggle-btn" aria-label="Switch map type">
            <img id="layer-toggle-preview"
                src="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/13/2933/4366"
                alt="Switch layer" class="layer-toggle-img">
            <span id="layer-toggle-label" class="layer-toggle-label">Satellite</span>
        </button>

        <button id="btn-layers" class="layer-switcher-layers-btn" aria-label="Show/Hide map layers">
            <md-icon name="layers" class="layer-switcher-layers-icon"></md-icon>
            <span class="layer-switcher-layers-label">Layers</span>
        </button>
    </div>

    <!-- Vertical Zoom Button Group (Pill-shaped) -->
    <div class="zoom-controls-wrapper">
        <md-button-group connected orientation="vertical" shape="pill" class="zoom-button-group">
            <md-icon-button id="btn-zoom-in" icon="add" aria-label="Zoom In"></md-icon-button>
            <md-icon-button id="btn-zoom-out" icon="remove" aria-label="Zoom Out"></md-icon-button>
        </md-button-group>
    </div>
</div>
