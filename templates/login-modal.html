<link rel="stylesheet" href="/css/login-modal.css">
<!-- Dedicated Sign-in Modal -->
<div id="login-modal" class="login-modal-backdrop hidden">
    <div class="login-modal-card">
        <div class="login-modal-header">
            <h2 class="login-modal-title">
                <span class="material-icons-outlined">cloud</span>
                <span data-i18n="login.title">Sign in to secure sync</span>
            </h2>
            <button id="btn-login-close"
                style="padding: 0.25rem; background: transparent; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 0.25rem;">
                <span class="material-icons-outlined" style="font-size: 1.125rem;">close</span>
            </button>
        </div>

        <div class="login-modal-body">
            <p class="login-modal-desc" data-i18n="login.subtitle">
                Configure synchronization with your personal Filen account. All places synced will be fully
                encrypted client-side; Filen will never see your password or plaintext places.
            </p>
            <p class="login-modal-terms">
                By using this service and enabling sync, you agree to our <a href="terms.html" target="_blank" data-i18n="nav.terms">Terms of Service</a> and <a
                    href="privacy.html" target="_blank" data-i18n="nav.privacy">Privacy Policy</a>.
            </p>

            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                <div class="input-group">
                    <label for="sync-email" data-i18n="login.email">Filen Email</label>
                    <input type="email" id="sync-email" placeholder="your-email@example.com">
                </div>
                <div class="input-group">
                    <label for="sync-password" data-i18n="login.password">Filen Password</label>
                    <input type="password" id="sync-password" placeholder="Enter your Filen password...">
                </div>
                <div class="input-group">
                    <label for="sync-twofactor" data-i18n="login.two_factor">Two-Factor Auth Code (Optional)</label>
                    <input type="text" id="sync-twofactor" placeholder="6-digit code if enabled...">
                </div>
            </div>

            <div id="sync-settings-status"
                style="color: var(--text-secondary); font-size: 0.75rem; text-align: center; min-height: 1rem; width: 100%;">
            </div>

            <div class="login-actions-group">
                <button id="btn-save-sync" data-i18n="login.sign_in" class="btn-login-save">
                    Save & Enable Sync
                </button>
                <button id="btn-login-cancel" data-i18n="markers.cancel" class="btn-login-cancel">
                    Cancel
                </button>
            </div>
        </div>
    </div>
</div>
